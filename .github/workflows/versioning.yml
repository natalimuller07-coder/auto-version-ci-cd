
name: Automatizacao de Versionamento

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  versionamento:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Incrementar versao
        shell: bash
        run: |
          VERSION=$(cat version.txt)
          VERSION=${VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((10#$PATCH + 1))
          echo "v${MAJOR}.${MINOR}.${PATCH}" > version.txt

      - name: Salvar nova versao
        shell: bash
        run: |
          git config user.name "CI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Incremento automatico da versao [skip ci]"
          git push origin HEAD:main
 
